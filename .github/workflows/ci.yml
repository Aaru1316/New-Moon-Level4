name: CI Pipeline — Sealed-Bid Auction MVP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Test ZK Circuits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Check / Lint
        run: npm run lint

      - name: Execute Vitest ZK Circuit & Contract Test Suite
        run: npm test

      - name: Build Web Application Bundle
        run: npm run build
